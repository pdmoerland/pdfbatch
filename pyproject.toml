[project]
name = "pdfbatch"
version = "0.1.0"
description = "Batch a folder of PDFs into Markdown + RIS (EndNote/Zotero) + JSON metadata, DOI-first"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "diskcache>=5.6.3",     # 30-day HTTP + link-check cache
    "python-dotenv>=1.0.0", # CONTACT_MAILTO / API keys from .env
    "pymupdf>=1.24",        # PDF text, fonts, XMP, link annotations (AGPL)
    "rapidfuzz>=3.0",       # title validation against the PDF text
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
pdf-batch = "pdfbatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdfbatch"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra"
