name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:                                   # a newer push supersedes a running check
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false                         # one system's failure must not hide the others'
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]               # the minimum in requires-python, and the newest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install (fails if uv.lock is out of date)
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run ruff check pdfbatch tests bench

      - name: mypy
        run: uv run mypy

      # Offline: the tests use synthetic PDFs and mocked APIs, so no secrets are needed.
      # Tesseract is not installed; the OCR tests fake it.
      # Failures also become an annotation: job logs need a GitHub login, annotations do not.
      - name: pytest
        shell: bash
        run: |
          # GitHub runs this with bash -eo pipefail: catch pytest's status rather than stop on it.
          status=0
          uv run pytest -rfE --tb=short 2>&1 | tee pytest.log || status=$?
          if [ "$status" != 0 ]; then
            lines=$(grep -E '^(FAILED|ERROR)|^E  ' pytest.log | head -40 || true)
            # No failed test reported (a crash, a collection or usage error): show how the output ended.
            [ -n "$lines" ] || lines=$(tail -n 30 pytest.log)
            echo                               # a crash can leave the last line open; ::error must start one
            echo "::error title=pytest exited with $status::$(printf '%s\n' "$lines" | awk '{printf "%s%%0A", $0}')"
          fi
          exit "$status"
